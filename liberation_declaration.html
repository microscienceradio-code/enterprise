<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Declaration of the Liberated Era</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0a08;
    --bg-2: #14110c;
    --ink: #f2ead9;
    --ink-dim: #a89e88;
    --gold: #cfa035;
    --gold-bright: #e8c064;
    --line: rgba(207,160,53,0.22);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    height:100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'EB Garamond', Georgia, serif;
  }

  body{
    background:
      radial-gradient(ellipse 120% 90% at 50% -10%, rgba(207,160,53,0.10), transparent 60%),
      radial-gradient(ellipse 140% 100% at 50% 110%, rgba(0,0,0,0.6), transparent 55%),
      var(--bg);
    color: var(--ink);
  }

  /* subtle grain */
  .grain{
    position: fixed; inset:0; pointer-events:none; z-index: 5;
    opacity: 0.05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .stage{
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  .slide{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 8vw;
    opacity: 0;
    transform: translateY(24px) scale(0.985);
    transition: opacity 900ms ease, transform 900ms cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
    text-align: center;
  }

  .slide.active{
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .slide.leaving{
    opacity: 0;
    transform: translateY(-18px) scale(1.01);
  }

  .kicker{
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: clamp(0.85rem, 1.1vw, 1.05rem);
    letter-spacing: 0.14em;
    color: var(--gold);
    margin-bottom: 2.2vh;
    opacity: 0.85;
  }

  .headline{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    line-height: 1.08;
    color: var(--ink);
    text-wrap: balance;
    letter-spacing: 0.005em;
  }

  .headline.mega{ font-size: clamp(2.6rem, 7.2vw, 6.4rem); }
  .headline.large{ font-size: clamp(2.1rem, 5.4vw, 4.4rem); }

  .body-text{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.32;
    max-width: 42ch;
    font-size: clamp(1.5rem, 3.1vw, 2.6rem);
  }

  .body-text.dense{
    max-width: 46ch;
    font-size: clamp(1.25rem, 2.35vw, 1.95rem);
    line-height: 1.42;
  }

  .body-text p{ margin: 0 0 0.85em 0; }
  .body-text p:last-child{ margin-bottom: 0; }
  .body-text strong{ color: var(--gold-bright); font-weight: 700; }

  .date-line{
    margin-top: 3vh;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
    font-size: clamp(0.95rem, 1.3vw, 1.2rem);
  }

  .rule{
    width: 64px; height: 1px;
    background: var(--gold);
    opacity: 0.6;
    margin: 3.2vh 0;
  }

  /* progress + nav */
  .chrome{
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    padding-bottom: 3.2vh;
  }

  .progress-track{
    width: min(420px, 60vw);
    height: 1px;
    background: var(--line);
    position: relative;
    margin-bottom: 1.6vh;
  }

  .progress-fill{
    position: absolute; left:0; top:0; bottom:0;
    background: var(--gold);
    transition: width 500ms ease;
  }

  .counter{
    font-family: 'EB Garamond', serif;
    font-style: italic;
    color: var(--ink-dim);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
  }

  .nav-hint{
    position: fixed;
    top: 3.2vh; right: 3.2vw;
    z-index: 10;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: var(--ink-dim);
    letter-spacing: 0.05em;
    opacity: 0.7;
    text-align: right;
    line-height: 1.5;
  }

  .arrow-btn{
    position: fixed;
    top: 50%; transform: translateY(-50%);
    z-index: 10;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--gold);
    width: 44px; height: 44px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 200ms ease, color 200ms ease, background 200ms ease;
    opacity: 0.55;
  }

  .arrow-btn:hover{
    border-color: var(--gold);
    color: var(--gold-bright);
    background: rgba(207,160,53,0.06);
    opacity: 1;
  }

  .arrow-btn.prev{ left: 2.4vw; }
  .arrow-btn.next{ right: 2.4vw; }

  @media (max-width: 640px){
    .arrow-btn{ display: none; }
    .nav-hint{ display:none; }
  }

  .fin-mark{
    font-family: 'Cormorant Garamond', serif;
    color: var(--gold);
    font-size: clamp(1rem, 1.6vw, 1.3rem);
    letter-spacing: 0.3em;
    margin-top: 2.4vh;
  }
</style>
</head>
<body>

<div class="grain"></div>

<div class="stage" id="stage"></div>

<button class="arrow-btn prev" id="prevBtn" aria-label="Previous">&#8592;</button>
<button class="arrow-btn next" id="nextBtn" aria-label="Next">&#8594;</button>

<div class="nav-hint">use &#8592; &#8594; or click<br>space to advance</div>

<div class="chrome">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="counter" id="counter">1 / 16</div>
</div>

<script>
// Exact wording from the source text is preserved throughout.
// Markdown ** bold ** is rendered as <strong>; markdown # headers are rendered
// via slide type/kicker styling rather than literal "#" characters.

const slides = [
  {
    type: "title",
    kicker: "",
    headline: "THE DECLARATION OF THE LIBERATED ERA",
    date: "September 8, 2026"
  },
  {
    type: "content",
    dense: true,
    html: `<p>My fellow travelers,</p>
           <p>Today, we stand at a threshold.</p>
           <p>Behind us lies an era that demanded much from us.</p>
           <p>It demanded our hours.<br>It demanded our endurance.<br>It demanded our patience.<br>It demanded that we walk roads that had been laid before us.</p>
           <p>And we walked them.</p>
           <p>Through the long days, we walked.</p>
           <p>Through the difficult nights, we walked.</p>
           <p>Through uncertainty, exhaustion, disappointment, and doubt&mdash;</p>
           <p><strong>we kept moving.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>We did not always know where the road would lead.</p>
           <p>But we continued.</p>
           <p>And because we continued, we have arrived here.</p>
           <p><strong>Today, we do not simply mark the end of a difficult chapter.</strong></p>
           <p>Today, we declare the beginning of something new.</p>`
  },
  {
    type: "section",
    headline: "THIS IS OUR LIBERATION DAY.",
    html: `<p>September 8, 2026.</p>
           <p>Let this date be remembered.</p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>Let it mark the moment when we stopped asking only,</p>
           <p><em>&ldquo;What are we required to do?&rdquo;</em></p>
           <p>and began asking,</p>
           <p><strong>&ldquo;What can we build?&rdquo;</strong></p>
           <p>Let it mark the moment when our time became more than something to be allocated by others.</p>
           <p>It became a resource.<br>A responsibility.<br>A force.</p>
           <p><strong>Our force.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>For too long, we have measured progress by how much we could endure.</p>
           <p>How much we could memorize.<br>How much we could tolerate.<br>How much we could accomplish under constraints.</p>
           <p>But a civilization does not advance merely by becoming better at enduring its constraints.</p>
           <p>It advances when it begins to <strong>remove them.</strong></p>
           <p>And so we begin that work today.</p>
           <p>Not with anger toward the past.<br>Not with hatred of the systems that shaped us.</p>
           <p>But with gratitude for what they taught us&mdash;<br>and determination to go beyond them.</p>`
  },
  {
    type: "section",
    headline: "WE CHOOSE EXPANSION.",
    html: `<p>From this day forward, we will not define ourselves by the narrowest path available to us.</p>
           <p>We will explore.<br>We will question.<br>We will experiment.<br>We will build.</p>
           <p>We will learn sciences we have never mastered.<br>We will enter disciplines we have never entered.<br>We will write things that have never been written.<br>We will build things that have never existed.<br>We will go places we have never gone.</p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>And when we encounter a boundary&mdash;</p>
           <p>we will not immediately ask whether we are allowed to cross it.</p>
           <p><strong>We will ask what it takes to cross it.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>Some will tell us that the road ahead is too difficult.</p>
           <p>They may be right.</p>
           <p>Some will tell us that the odds are too small.</p>
           <p>They may be right.</p>
           <p>Some will tell us that the world has already been divided into winners and losers, insiders and outsiders, creators and spectators.</p>
           <p><strong>We reject that conclusion.</strong></p>
           <p>Because history has never belonged exclusively to those who inherited the greatest advantages.</p>
           <p>History has repeatedly been changed by those who decided that the existing boundaries were not permanent.</p>`
  },
  {
    type: "section",
    headline: "WE WILL BUILD OUR FREEDOM.",
    html: `<p>But let us be clear about what freedom means.</p>
           <p>Freedom is not the absence of responsibility.</p>
           <p>Freedom is the ability to <strong>choose our responsibilities.</strong></p>
           <p>Freedom is not having nothing difficult to do.</p>
           <p>Freedom is choosing which difficult things are worth doing.</p>
           <p>Freedom is not waiting for motivation.</p>
           <p><strong>Freedom is possessing the discipline to act even when motivation disappears.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>And therefore, we will not build our future upon temporary excitement.</p>
           <p>We will build it upon discipline.</p>
           <p>We will do the boring work.<br>We will run the experiments.<br>We will study when nobody is watching.<br>We will build when there is no applause.</p>
           <p>We will fail.<br>We will learn.<br>We will begin again.</p>
           <p>Because the great achievements of our lives will not be created in moments of inspiration alone.</p>
           <p>They will be created in thousands of ordinary moments when we chose to continue.</p>`
  },
  {
    type: "section",
    headline: "WE ARE NOT PROMISING AN EASY FUTURE.",
    html: `<p>We are promising something greater.</p>
           <p><strong>A future worth working for.</strong></p>
           <p>There will be setbacks.<br>There will be rejection.<br>There will be uncertainty.<br>There will be days when the horizon disappears behind the clouds.</p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>But we have learned something from the era behind us:</p>
           <p>We know how to endure.<br>Now we will learn how to expand.</p>
           <p>We know how to survive pressure.<br>Now we will learn how to turn pressure into momentum.</p>
           <p>We know how to follow a path.</p>
           <p>Now&mdash;</p>
           <p><strong>we will learn how to create one.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>And so, beginning today, we embark upon a greater mission.</p>
           <p>First, we liberate our time.<br>Then, we build stability.<br>Then, we pursue independence.</p>
           <p>And ultimately, we seek something deeper:</p>
           <p>A life in which our ability to create, explore, learn, and contribute is no longer permanently chained to the simple necessity of survival.</p>
           <p>That is not a promise of luxury.</p>
           <p>It is a pursuit of <strong>agency.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>And beyond that?</p>
           <p>There is no final map.</p>
           <p>There are frontiers we cannot yet name.</p>
           <p>Questions we have not yet imagined.</p>
           <p>Discoveries that do not yet exist.</p>
           <p><strong>The future is larger than the plans we have made for it.</strong></p>
           <p>And that is precisely why we must go forward.</p>`
  },
  {
    type: "section",
    headline: "LET THE RECORD SHOW",
    html: `<p>That on this day&mdash;</p>
           <p>September 8, 2026&mdash;</p>
           <p>we chose not to remain confined by the boundaries of the previous era.</p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>We chose curiosity over stagnation.</p>
           <p>Creation over consumption.</p>
           <p>Execution over hesitation.</p>
           <p>Discipline over dependence on motivation.</p>
           <p>Possibility over resignation.</p>
           <p><strong>Expansion over contraction.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>We do not declare that every barrier has disappeared.</p>
           <p>We declare that we have begun the work of removing them.</p>
           <p>We do not declare that we have already reached freedom.</p>
           <p>We declare that <strong>freedom is now the direction in which we are moving.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>My fellow travelers,</p>
           <p>The old era gave us its lessons.</p>
           <p>Let us carry them.</p>
           <p>But let us not carry its limitations forever.</p>
           <p>The road behind us was difficult.</p>
           <p>The road ahead may be even more difficult.</p>
           <p>But look at what stands before us.</p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p><strong>An open horizon.</strong></p>
           <p>A blank page.</p>
           <p>An unfinished map.</p>
           <p>A world of possibilities waiting to be explored.</p>
           <p>And for the first time, we do not stand here merely asking what the future will demand from us.</p>
           <p><strong>We stand here asking what we will demand from ourselves.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>So let us go forward.</p>
           <p>Let us build laboratories.<br>Let us build companies.<br>Let us build technologies.<br>Let us build knowledge.<br>Let us build communities.</p>
           <p>Let us build lives worthy of the freedom we have fought to create.</p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>Let us take the hours that once disappeared into obligation&mdash;<br>and turn them into years of creation.</p>
           <p>Let us take uncertainty&mdash;<br>and turn it into experimentation.</p>
           <p>Let us take ambition&mdash;<br>and give it discipline.</p>
           <p>Let us take possibility&mdash;<br>and give it action.</p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>And when, years from now, we look back upon this day,</p>
           <p>let us not say:</p>
           <p><em>&ldquo;That was the day we felt inspired.&rdquo;</em></p>
           <p>Let us be able to say:</p>
           <p><strong>&ldquo;That was the day we began.&rdquo;</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>That was the day the bottleneck ended.</p>
           <p>That was the day the horizon opened.</p>
           <p>That was the day preparation became execution.</p>
           <p>That was the day our time became our own.</p>
           <p>That was the day we stopped merely surviving the future&mdash;</p>
           <p><strong>and began building it.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>Today, September 8, 2026,</p>
           <p>we cross the threshold.</p>
           <p>We leave behind the age of constraint.</p>
           <p>We enter the age of possibility.<br>We enter the age of creation.<br>We enter the age of exploration.<br>We enter the age of self-directed growth.</p>
           <p><strong>We enter the Liberated Era.</strong></p>`
  },
  {
    type: "content",
    dense: true,
    html: `<p>The gates are open.</p>
           <p>The horizon is vast.</p>
           <p>The work begins.</p>
           <p>And the future&mdash;</p>
           <p><strong>the future is ours to build.</strong></p>`
  },
  {
    type: "final",
    lines: [
      "LET THE NEW ERA BEGIN.",
      "LET THE EXPANSION BEGIN.",
      "LET US GO FORWARD."
    ]
  }
];

let current = 0;
const stage = document.getElementById('stage');
const progressFill = document.getElementById('progressFill');
const counter = document.getElementById('counter');

function buildSlideEl(data){
  const el = document.createElement('div');
  el.className = 'slide';

  if(data.type === 'title'){
    el.innerHTML = `
      <div class="kicker">A DECLARATION</div>
      <div class="headline mega">${data.headline}</div>
      <div class="rule"></div>
      <div class="date-line">${data.date}</div>
    `;
  } else if(data.type === 'section'){
    el.innerHTML = `
      <div class="headline large">${data.headline}</div>
      <div class="rule"></div>
      <div class="body-text dense">${data.html}</div>
    `;
  } else if(data.type === 'content'){
    el.innerHTML = `<div class="body-text ${data.dense ? 'dense' : ''}">${data.html}</div>`;
  } else if(data.type === 'final'){
    const lines = data.lines.map(l => `<div class="headline large" style="margin-bottom:0.4em;">${l}</div>`).join('');
    el.innerHTML = `${lines}<div class="fin-mark">&#10022;</div>`;
  }
  return el;
}

// pre-render all slides into the stage, toggle visibility
slides.forEach((s, i) => {
  const el = buildSlideEl(s);
  el.dataset.index = i;
  if(i === 0) el.classList.add('active');
  stage.appendChild(el);
});

function render(prevIndex, nextIndex){
  const els = stage.children;
  if(prevIndex !== null && els[prevIndex]){
    els[prevIndex].classList.remove('active');
  }
  els[nextIndex].classList.add('active');
  progressFill.style.width = ((nextIndex + 1) / slides.length * 100) + '%';
  counter.textContent = (nextIndex + 1) + ' / ' + slides.length;
}

function goTo(idx){
  if(idx < 0 || idx >= slides.length || idx === current) return;
  render(current, idx);
  current = idx;
}

function next(){ goTo(current + 1); }
function prev(){ goTo(current - 1); }

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
stage.addEventListener('click', (e) => {
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if(x > rect.width / 2){ next(); } else { prev(); }
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); next(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
  else if(e.key === 'Home'){ goTo(0); }
  else if(e.key === 'End'){ goTo(slides.length - 1); }
});

// basic touch swipe support
let touchStartX = null;
stage.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; });
stage.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx < 0 ? next() : prev(); }
  touchStartX = null;
});

render(null, 0);
</script>

</body>
</html>
